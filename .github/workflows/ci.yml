name: CI

on:
  push:
    branches: [main]
  pull_request:

# Actions are pinned to full commit SHAs (supply-chain hardening); the trailing "# vX" comment is the
# human-readable version. Dependabot (github-actions, monthly) bumps both the SHA and the comment.
# Kept identical to release.yml's pins.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
      - run: pnpm run smoke

  # Tier 2 — real-Docker integration tests. Separate job: Linux runners ship Docker, so the
  # Docker-backed adapter tests run here (the Tier-1 `check` job stays Docker-free and fast).
  # GitHub sets CI=true, which un-skips the integration suites (see the packages' integration configs).
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # Per-package real-MySQL suites (each provisions its own mysql:8.4 via Docker)…
      - run: pnpm --filter @babystack/docker test:integration
      - run: pnpm --filter @babystack/mysql test:integration
      - run: pnpm --filter @babystack/vitest test:integration
      - run: pnpm --filter @babystack/cli test:integration
      # …and the end-to-end proof: the examples app's real Express+Drizzle+MySQL suite via babystack.
      - run: pnpm run test:examples
