name: CI

on:
  push:
    branches: [main]
  pull_request:

# NOTE (hardening follow-up, tracked in the roadmap): pin these actions to full commit SHAs.
# Dependabot (github-actions, monthly) is configured to keep them current once pinned.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
      - run: pnpm run smoke
      # Unit tests for the release gate itself (scripts/*.test.mjs). The root `test` script is
      # `turbo run test --filter=./packages/*`, so nothing under scripts/ is covered by it.
      - run: pnpm run test:release
      # The release setup is config that lives OUTSIDE this repo's diff — the `release` GitHub environment
      # and its required reviewer. Nothing in a PR shows when they disappear, and the cost of noticing at
      # release time is an unapproved publish to npm, which cannot be taken back. Checking it here means
      # drift surfaces within a day, on an ordinary PR, instead of at the one moment it matters.
      # `--environment` reads the public environments API; the token only raises the rate limit.
      - run: node scripts/check-release.mjs --environment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Tier 2 — real-Docker integration tests. Separate job: Linux runners ship Docker, so the
  # Docker-backed adapter tests run here (the Tier-1 `check` job stays Docker-free and fast).
  # GitHub sets CI=true, which un-skips the integration suites (see the packages' integration configs).
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # Per-package real-MySQL suites (each provisions its own mysql:8.4 via Docker)…
      - run: pnpm --filter @babystack/docker test:integration
      - run: pnpm --filter @babystack/mysql test:integration
      - run: pnpm --filter @babystack/vitest test:integration
      - run: pnpm --filter @babystack/cli test:integration
      # …and the end-to-end proof: the examples app's real Express+Drizzle+MySQL suite via babystack.
      - run: pnpm run test:examples
